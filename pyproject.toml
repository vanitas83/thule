[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thule-cli"
version = "1.0.0"
description = "Minimalist local-first terminal coding assistant and multi-agent orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
telemetry = [
    "psutil>=5.9.0",
]

[project.scripts]
thule = "thule:main"

[tool.setuptools]
py-modules = ["thule"]
